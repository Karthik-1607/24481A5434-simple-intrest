<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #155724;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Interest Calculator</h1>
        <form method="POST" action="/calculate">
            <label for="principal">Principal</label>
            <input type="number" step="0.01" name="principal" id="principal" required>

            <label for="rate">Rate (%)</label>
            <input type="number" step="0.01" name="rate" id="rate" required>

            <label for="time">Time (years)</label>
            <input type="number" step="0.01" name="time" id="time" required>

            <button type="submit">Calculate</button>
        </form>

        {% if result is not none %}
        <div class="result">
            Simple Interest: {{ result }}
        </div>
        {% endif %}
    </div>
</body>
</html>
